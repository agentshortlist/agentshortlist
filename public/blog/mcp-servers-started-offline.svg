<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="41 MCP servers started with no internet: 8 reached an address their opt-out silences (5 at startup, 3 only at shutdown), 21 contacted nothing, 7 contacted a package registry or GitHub, 4 contacted their own service or a model host, 1 gave no result.">
